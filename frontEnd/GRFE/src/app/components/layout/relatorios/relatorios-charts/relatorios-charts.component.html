<p class="report-state" *ngIf="carregando">Carregando gráficos...</p>
<p class="report-state error" *ngIf="erro">Não foi possível carregar os gráficos. Verifique a conexão com o back-end.</p>

<section class="charts-content" *ngIf="dados">
	<div class="card chart-card trend-card">
		<div class="card-body">
			<div class="chart-heading">
				<h2>Tendência Mensal — {{ anoGrafico }}</h2>
				<label class="period-filter" for="periodoGrafico">Período
					<select id="periodoGrafico" class="form-select" [(ngModel)]="periodoSelecionado" (ngModelChange)="atualizarPeriodo()">
						<option *ngFor="let periodo of periodos" [ngValue]="periodo.valor">{{ periodo.label }}</option>
					</select>
				</label>
			</div>
			<div class="chart-area"><canvas #tendenciaChart></canvas></div>
		</div>
	</div>

	<section class="charts-grid">
		<div class="card chart-card">
			<div class="card-body">
				<h2>Incidentes por Semana</h2>
				<div class="chart-area small-chart"><canvas #semanasChart></canvas></div>
			</div>
		</div>
		<div class="card chart-card">
			<div class="card-body">
				<h2>Incidentes por Setor (Jun–Ago)</h2>
				<div class="chart-area small-chart"><canvas #setoresChart></canvas></div>
			</div>
		</div>
	</section>
</section>
