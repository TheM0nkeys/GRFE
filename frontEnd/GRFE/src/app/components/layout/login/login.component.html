<main class="login-shell">
  <section class="brand-panel" [style.background-image]="'url(\'' + backgroundImage + '\')'" aria-label="Itaipu Binacional">
    <div class="brand-lockup">
      <img src="https://tinyurl.com/59f973ah" alt="Logo Itaipu Binacional" class="brand-logo">
      <strong>Itaipu Binacional</strong>
    </div>

    <div class="brand-message">
      <h1>DIVISAO DE PRODUÇÃO DE TI</h1>
      <p>SI.PP.AA</p>
    </div>
  </section>

  <section class="form-panel">
    <div class="login-card">
      <p class="form-kicker">ACESSO CORPORATIVO</p>
      <h2>Bem-vindo</h2>
      <p class="form-subtitle">Acesse com suas credenciais corporativas</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <label for="userInput">E-mail</label>
        <input id="userInput" type="text" formControlName="username" placeholder="seu@itaipu.gov.br" autocomplete="username">
        <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid" class="field-error">Informe seu usuário ou e-mail.</div>

        <label for="passwordInput">Senha</label>
        <input id="passwordInput" type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password">
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="field-error">A senha deve ter pelo menos 6 caracteres.</div>

        <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
      </form>

    </div>
  </section>
</main>
