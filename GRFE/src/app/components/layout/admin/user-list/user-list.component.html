<main class="users-page">
  <header class="page-header"><div><span>ADMINISTRAÇÃO</span><h1>Usuários e plantonistas</h1><p>Dados carregados diretamente do backend.</p></div><button type="button" (click)="novoUsuario()">Novo usuário</button></header>
  <div class="error" *ngIf="erro">{{ erro }}</div>
  <form class="editor" *ngIf="formularioAberto" (ngSubmit)="salvarUsuario()">
    <label>Nome<input name="nome" [(ngModel)]="dados.nome" required></label>
    <label>E-mail<input name="email" type="email" [(ngModel)]="dados.email" required></label>
    <label>Especialidade<app-escolha-dropdown name="especialidadeId" [options]="especialidades" [selectedId]="especialidadeIdSelecionada" placeholder="Pesquise uma especialidade" [required]="true" (selectedIdChange)="especialidadeIdSelecionada = $event"></app-escolha-dropdown></label>
    <div class="actions"><button type="button" (click)="cancelar()">Cancelar</button><button type="submit">Salvar</button></div>
  </form>
  <section class="table-wrap"><div class="empty" *ngIf="!carregando && !usuarios.length">Nenhum usuário retornado pelo backend.</div><table *ngIf="usuarios.length"><thead><tr><th>Nome</th><th>Matrícula</th><th>E-mail</th><th>Especialidades</th><th>Ações</th></tr></thead><tbody><tr *ngFor="let usuario of usuarios"><td>{{ usuario.nome }}</td><td>{{ usuario.matricula }}</td><td>{{ usuario.email }}</td><td>{{ usuario.especialidade || 'Sem especialidade' }}</td><td><button type="button" (click)="editarUsuario(usuario)">Editar</button><button type="button" (click)="removerUsuario(usuario)">Excluir</button></td></tr></tbody></table></section>
</main>
